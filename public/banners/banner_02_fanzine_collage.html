<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner LCB - Opción 2: Fanzine Collage</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1920px;
      height: 600px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #061A42;
      position: relative;
    }
    
    /* Background Image */
    .bg-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Asymmetric Collage Visual Blocks */
    .collage-block-yellow {
      position: absolute;
      top: -100px;
      right: 250px;
      width: 320px;
      height: 800px;
      background: #FFE600;
      transform: rotate(15deg);
      border-left: 8px solid #061A42;
      border-right: 8px solid #061A42;
      z-index: 2;
      opacity: 0.15;
    }
    .collage-block-green {
      position: absolute;
      bottom: -200px;
      left: 100px;
      width: 400px;
      height: 500px;
      background: #28B838;
      transform: rotate(-10deg);
      border: 6px solid #061A42;
      z-index: 2;
      opacity: 0.1;
    }

    /* Content Layout */
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      padding: 70px 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Text & Badges Stack */
    .main-stack {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .titles {
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    .badge-fanzine {
      background: #28B838;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      padding: 6px 20px;
      border: 3px solid white;
      box-shadow: 4px 4px 0px #061A42;
      transform: rotate(-1.5deg);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 140px;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: white;
    }
    h1 span.yellow-text {
      color: #FFE600;
      background: #061A42;
      padding: 0 16px;
      display: inline-block;
      border: 4px solid #FFE600;
      transform: rotate(1deg);
      box-shadow: 8px 8px 0px #28B838;
    }

    p.subheadline {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: #E2E8F0;
      max-width: 800px;
      line-height: 1.4;
      margin-top: 10px;
    }

    /* Call To Action (CTA) Button (Right) */
    .cta-area {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 20px;
    }
    
    .cta-button {
      background: #28B838;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 0.05em;
      padding: 14px 40px;
      border: 3px solid white;
      box-shadow: 6px 6px 0px #FFE600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transform: rotate(-1deg);
    }
    .cta-button:hover {
      box-shadow: none;
      transform: translate(6px, 6px) rotate(-1deg);
    }
  </style>
</head>
<body>

  <!-- Background Imagery -->
  <div class="bg-container">
    <img src="fanzine_collage.jpg" alt="Background" class="bg-image">
    <div class="grid-overlay"></div>
    <div class="collage-block-yellow"></div>
    <div class="collage-block-green"></div>
  </div>

  <!-- Content Layer -->
  <div class="content">
    
    <!-- Main Stack -->
    <div class="main-stack">
      <div class="titles">
        <span class="badge-fanzine">FANZINE OFICIAL LCB • TEMPORADA 2026</span>
        <h1>LIGA CANARIA <br><span class="yellow-text">DE BASKETBOL</span></h1>
        <p class="subheadline">La pasión de los barrios y municipios de Canelones, unida en un torneo histórico y vibrante.</p>
      </div>

      <div class="cta-area">
        <!-- Action Button -->
        <div class="cta-button">EXPLORAR TORNEO &rarr;</div>
      </div>
    </div>

  </div>

</body>
</html>
